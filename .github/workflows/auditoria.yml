# Domingo: testa todas as fontes automáticas e abre um aviso se alguma fonte ativa falhar.
name: Auditoria das fontes
on:
  schedule:
    - cron: "17 5 * * 0"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m fluxo audit | tee out.txt
      - run: |
          git config user.name "fluxo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ESTADO-FONTES.md
          git diff --cached --quiet || git commit -m "auditoria das fontes: $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q "com problemas (ativas): nenhuma" out.txt; then
            gh issue create --title "Fontes com problemas ($(date -u +%F))" --body "$(cat out.txt). Detalhe em docs/ESTADO-FONTES.md."
          fi
