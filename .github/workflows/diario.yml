# Execução diária: recolha, peças de dados, notícias, revisão e publicação do site.
name: Diário
on:
  schedule:
    - cron: "23 6 * * *"          # 06:23 UTC (06:23 em Lisboa no inverno, 07:23 no verão)
    # Dias úteis: tentativas extra só se ainda não houver notícia hoje (feriados de Lisboa tratados no código).
    - cron: "23 7 * * 1-5"
    - cron: "3 8 * * 1-5"         # antes do email das 8h30
    - cron: "23 11 * * 1-5"       # último recurso
  workflow_dispatch:
    inputs:
      data:
        description: "Forçar peças de dados (ex.: brent_fx,gas_storage)"
        required: false
        default: ""
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recolher, redigir e validar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "23 6 * * *" ]; then EXTRA="--catch-up"; fi
          python -m fluxo daily --drafts drafts --summary out/summary.json --data "${{ inputs.data }}" $EXTRA
          python -m fluxo status > /dev/null
      - name: Guardar dados e artigos publicados
        run: |
          git config user.name "fluxo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data content docs/ESTADO.md
          git diff --cached --quiet || git commit -m "diário: $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push
      - name: Abrir pedido de revisão com os rascunhos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d drafts/content ] && [ -n "$(ls -A drafts/content 2>/dev/null)" ]; then
            BR="revisao/$(date -u +%F-%H%M)"
            git switch -c "$BR"
            cp -r drafts/content/. content/
            git add content
            git commit -m "rascunhos para revisão: $(date -u +%F)"
            git push -u origin "$BR"
            python .github/scripts/pr_body.py out/summary.json > out/pr.md
            gh pr create --base main --head "$BR" --title "Revisão $(date -u +%F)" --body-file out/pr.md
          else
            echo "Sem rascunhos para revisão."
          fi
  publicar:
    needs: diario
    uses: ./.github/workflows/publicar.yml
    permissions:
      contents: read
      pages: write
      id-token: write
