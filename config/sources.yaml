# Inventário de fontes do Fluxo Energético.
# - bee: número do favorito na pasta BEE (1–41). Fontes adicionais têm bee: null e extra: true.
# - method: rss | html | json | api | manual | tool
# - tier: pontos de credibilidade (0–25) usados na pontuação editorial.
# - verified: o que foi confirmado em 16/11/2026 (leitura da página/feed). "não" = validar com `python -m fluxo audit`.
# - link_pattern (html): expressão regular que os URLs dos artigos têm de cumprir.
# - date_in_url: true quando a data vem no próprio URL (/2026/11/12/).

defaults:
  lang: en
  enabled: true
  tier: 15

sources:
  # ---------------- BEE → Economia ----------------
  - id: gee-indicadores
    bee: 1
    name: Indicadores Diários — GEE
    institution: GEE (Ministério da Economia)
    url: https://gee.gov.pt/pt/indicadores-diarios/indicadores-diarios-gee?view=articles&category_id=23&menu_id=1494&article_id=17764
    group: economica
    method: manual
    enabled: false
    tier: 20
    lang: pt
    frequency: diária
    licence: não indicada
    verified: "robots.txt bloqueia acesso automático (16/11/2026)"
    notes: Consulta manual. Brent e câmbio obtêm-se automaticamente via EIA e BCE (fontes adicionais).

  - id: eurostat-news
    bee: 2
    name: Eurostat (notícias — energia e ambiente)
    institution: Eurostat
    url: https://ec.europa.eu/eurostat
    group: primaria
    method: rss
    feeds:
      - https://ec.europa.eu/eurostat/en/search?p_p_id=estatsearchportlet_WAR_estatsearchportlet&p_p_lifecycle=2&p_p_state=maximized&p_p_mode=view&p_p_resource_id=atom&_estatsearchportlet_WAR_estatsearchportlet_theme=PER_ENVENE&_estatsearchportlet_WAR_estatsearchportlet_collection=CAT_EURNEW
      - https://ec.europa.eu/eurostat/en/search?p_p_id=estatsearchportlet_WAR_estatsearchportlet&p_p_lifecycle=2&p_p_state=maximized&p_p_mode=view&p_p_resource_id=atom&_estatsearchportlet_WAR_estatsearchportlet_theme=PER_ENVENE&_estatsearchportlet_WAR_estatsearchportlet_collection=CAT_PREREL
    tier: 25
    frequency: diária
    licence: CC BY 4.0 (exceto dados de terceiros e logótipos)
    verified: "feeds Atom listados em /web/rss/about-rss"

  - id: eurostat-se
    bee: 3
    name: Eurostat — Statistics Explained (novos e atualizados)
    institution: Eurostat
    url: https://ec.europa.eu/eurostat/statistics-explained/index.php?title=New_and_updated_articles
    group: primaria
    method: html
    link_pattern: 'statistics-explained/index\.php\?title=(?!New_and_updated|Special:|Main_Page)[A-Za-z0-9_%(),-]+$'
    tier: 25
    frequency: diária
    licence: CC BY 4.0
    verified: "página lista artigos por data (16/10/2026: Electricity and heat statistics)"

  - id: ine-destaques
    bee: 4
    name: INE — Destaques
    institution: Instituto Nacional de Estatística
    url: https://www.ine.pt/xportal/xmain?xpgid=ine_main&xpid=INE&xlang=pt
    group: primaria
    method: rss
    feeds:
      - https://www.ine.pt/ine/rssfeed_dst.jsp?lang=PT
    tier: 25
    lang: pt
    frequency: diária (dias úteis)
    licence: "© INE; reutilização com citação da fonte"
    verified: "RSS de Destaques e Publicações, JSON e calendário ICS listados em 'Recursos'"
    notes: API de dados disponível (xpgid=ine_api_v2) para peças de dados futuras.

